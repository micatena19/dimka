<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Panel · dimka.cm</title>
<style>
:root{--cream:#fff8ee;--brown:#442f2a;--blush:#f5c8d7;--pinky:#b12b5c}
*{box-sizing:border-box}
body{background:var(--cream);color:var(--brown);font:400 1rem/1.5 system-ui,sans-serif;padding:1.25rem;max-width:640px;margin:auto}
h1,h2{line-height:1.1}
label{display:block;margin:.6rem 0 .2rem;font-weight:600;font-size:.9rem}
input,textarea{width:100%;padding:.7rem;border:2px solid var(--brown);border-radius:12px;background:#fff;font:inherit;color:inherit;margin-top:.2rem}
fieldset{border:2px solid var(--blush);border-radius:16px;margin:1rem 0;padding:.5rem 1rem 1rem}
button{background:var(--pinky);color:#fff;border:0;border-radius:999px;padding:.8rem 1.4rem;font:600 1rem system-ui,sans-serif;cursor:pointer;margin-top:.8rem}
#msg{margin:1rem 0;font-weight:600;min-height:1.5rem}
.save{position:sticky;bottom:0;background:var(--cream);padding:.8rem 0}
:focus-visible{outline:3px solid var(--pinky);outline-offset:2px}
</style></head><body>
<h1>Panel de dimka.cm</h1>
<fieldset><legend>Conexión con GitHub</legend>
<label>Tu usuario de GitHub<input id="u" autocomplete="off"></label>
<label>Nombre del repositorio<input id="r" autocomplete="off"></label>
<label>Token de acceso<input id="t" type="password" autocomplete="off"></label>
<button id="load" type="button">Cargar datos</button></fieldset>
<div id="msg" role="status" aria-live="polite"></div>
<div id="form"></div>
<div class="save" id="sv" hidden><button id="save" type="button">Guardar cambios</button></div>
<script>
const $=s=>document.querySelector(s);let D,sha;const DEF={"hero_sub": "redes y diseño para negocios con ganas de crecer", "hero_txt": "Nos encargamos de tus redes para que vos te dediques a tu negocio.", "serv_t": "Más que manejo de redes", "serv_d": "Elegí lo que necesitás, con o sin plan mensual.", "s1_t": "Redes sociales", "s1_d": "Estrategia, contenido y publicación todos los meses.", "s2_t": "Marca e identidad visual", "s2_d": "Creamos o renovamos tu marca de punta a punta.", "s3_t": "Edición de video", "s3_d": "Piezas sueltas, sin plan. Desde $20.000.", "s4_t": "Páginas web", "s4_d": "Tu web con un panel para que la actualices vos.", "plan_t": "Armá tu plan", "plan_d": "Elegí un plan base, sumá lo que necesites y mirá el estimado al instante.", "plan_n": "Todos los planes incluyen jornada presencial. Los formatos varían según la estrategia de cada mes. Es un estimado: el precio final se confirma después de hablar con vos.", "marca_t": "Antes de pensar en el logo, revisá esto", "marca_d": "Tildá lo que ya tenés claro. Diseñar una marca empieza por tener dirección.", "trab_t": "Nuestro trabajo", "trab_d": "Lo que hacemos, de verdad.", "res_t": "Quienes confiaron en nosotras", "res_d": "Marcas que confiaron en nosotras.", "cont_t": "¿Hacemos crecer tu marca?", "cont_d": "Contanos qué necesitás y te respondemos por WhatsApp o a dimkamkt@gmail.com."};const LAB={"hero_sub": "Portada: frase principal", "hero_txt": "Portada: texto", "serv_t": "Servicios: título", "serv_d": "Servicios: bajada", "s1_t": "Servicio 1: título", "s1_d": "Servicio 1: texto", "s2_t": "Servicio 2: título", "s2_d": "Servicio 2: texto", "s3_t": "Servicio 3: título", "s3_d": "Servicio 3: texto", "s4_t": "Servicio 4: título", "s4_d": "Servicio 4: texto", "plan_t": "Planes: título", "plan_d": "Planes: bajada", "plan_n": "Planes: aclaración", "marca_t": "Checklist de marca: título", "marca_d": "Checklist de marca: bajada", "trab_t": "Trabajos: título", "trab_d": "Trabajos: bajada", "res_t": "Reseñas: título", "res_d": "Reseñas: bajada", "cont_t": "Contacto: título", "cont_d": "Contacto: texto"};
const cfg=JSON.parse(localStorage.getItem("cfg")||"{}");
for(const k of["u","r","t"])$("#"+k).value=cfg[k]||"";
const url=()=>`https://api.github.com/repos/${$("#u").value.trim()}/${$("#r").value.trim()}/contents/data.json`;
const hd=()=>({Authorization:"Bearer "+$("#t").value.trim(),Accept:"application/vnd.github+json"});
const say=t=>$("#msg").textContent=t;
const esc=v=>String(v).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;");
const get=(o,p)=>p.split(".").reduce((a,k)=>a[k],o);
const f=(l,p,n)=>`<label>${l}<input data-p="${p}" ${n?'type="number"':""} value="${esc(get(D,p))}"></label>`;
function render(){
 let h="<h2>Contacto</h2>"+f("WhatsApp (con código de país, sin + ni espacios)","wa")+f("Instagram (link)","ig")+f("Mail","mail");
 h+="<h2>Planes</h2>"+D.planes.map((p,i)=>`<fieldset>${f("Nombre",`planes.${i}.n`)}${f("Precio",`planes.${i}.p`,1)}<label>Qué incluye (una línea por ítem)<textarea data-p="planes.${i}.items" data-l="1" rows="5">${esc(p.items.join("\n"))}</textarea></label></fieldset>`).join("");
 h+="<h2>Extras</h2>"+D.extras.map((e,i)=>`<fieldset>${f("Nombre",`extras.${i}.n`)}${f("Precio",`extras.${i}.p`,1)}<button type="button" data-rm="extras" data-i="${i}">Quitar</button></fieldset>`).join("")+`<button type="button" id="adde">Agregar extra</button>`;
 h+="<h2>Diseño web</h2>"+f("Título","web.t")+f("Texto","web.d")+f("Precio (texto)","web.p");
 h+="<h2>Nuestro trabajo</h2><p>Subí fotos de tus trabajos. Se achican solas.</p>"+D.trabajos.map((x,i)=>`<fieldset><div>${x.imgs.map(p=>`<img src="${esc(p)}" alt="" style="width:80px;height:100px;object-fit:cover;border-radius:10px;margin:0 6px 6px 0">`).join("")}</div>${f("Descripción corta",`trabajos.${i}.t`)}${f("Link al reel o publicación (opcional)",`trabajos.${i}.l`)}<label>Sumar otra imagen a este trabajo (si es un carrusel)<input type="file" accept="image/*" data-add="${i}"></label><button type="button" data-rmimg="${i}">Quitar última imagen</button> <button type="button" data-rm="trabajos" data-i="${i}">Quitar trabajo</button></fieldset>`).join("")+`<label>Agregar un trabajo nuevo (elegí su primera imagen)<input type="file" id="up" accept="image/*"></label>`;
 h+="<h2>Reseñas</h2>"+D.resenas.map((x,i)=>`<fieldset>${x.foto?`<img src="${esc(x.foto)}" alt="" style="width:64px;height:64px;border-radius:50%;object-fit:cover">`:""}<label>Foto o logo de quien dejó la reseña (opcional)<input type="file" accept="image/*" data-rfoto="${i}"></label><label>Reseña<textarea data-p="resenas.${i}.txt" rows="3">${esc(x.txt)}</textarea></label>${f("Nombre y marca",`resenas.${i}.n`)}${f("Estrellas (1 a 5)",`resenas.${i}.e`,1)}${f("Link a su Instagram (opcional)",`resenas.${i}.ig`)}<button type="button" data-rm="resenas" data-i="${i}">Quitar</button></fieldset>`).join("")+`<button type="button" id="addr">Agregar reseña</button>`;
 h+="<h2>Textos de la página</h2><details><summary><b>Tocá para editar los textos</b></summary>"+Object.keys(DEF).map(k=>f(LAB[k],"textos."+k)).join("")+"</details>";
 $("#form").innerHTML=h;
}
function collect(){document.querySelectorAll("[data-p]").forEach(el=>{const ks=el.dataset.p.split(".");const last=ks.pop();const o=ks.reduce((a,k)=>a[k],D);o[last]=el.dataset.l?el.value.split("\n").map(x=>x.trim()).filter(Boolean):el.type==="number"?Number(el.value):el.value})}
async function subir(file,at,rs){
 say("Subiendo foto…");
 const bm=await createImageBitmap(file);const k=Math.min(1,(rs?300:1200)/Math.max(bm.width,bm.height));
 const c=document.createElement("canvas");c.width=Math.round(bm.width*k);c.height=Math.round(bm.height*k);
 c.getContext("2d").drawImage(bm,0,0,c.width,c.height);
 const path=(rs?"img/resena-":"img/trabajo-")+Date.now()+".jpg";
 const r=await fetch(url().replace("data.json",path),{method:"PUT",headers:hd(),body:JSON.stringify({message:"Foto desde el panel",content:c.toDataURL("image/jpeg",.85).split(",")[1]})});
 if(!r.ok)throw new Error("No se pudo subir la foto. Revisá el token.");
 collect();if(rs)D.resenas[at].foto=path;else if(at===undefined)D.trabajos.push({imgs:[path],img:path,t:"",l:""});else D.trabajos[at].imgs.push(path);render();say("Foto subida. Tocá Guardar cambios para publicarla.");
}
$("#form").onclick=e=>{const b=e.target.closest("button");if(!b)return;
 if(b.dataset.rm){collect();D[b.dataset.rm].splice(+b.dataset.i,1);render()}
 if(b.id==="adde"){collect();D.extras.push({id:"x"+Date.now(),n:"Nuevo extra",p:0});render()}
 if(b.id==="addr"){collect();D.resenas.push({txt:"",n:"",e:5,foto:"",ig:""});render()}
 if(b.dataset.rmimg!==undefined){collect();const L=D.trabajos[+b.dataset.rmimg].imgs;if(L.length>1)L.pop();render()}};
$("#form").onchange=e=>{const t=e.target,fl=t.files&&t.files[0];if(!fl)return;if(t.id==="up")subir(fl).catch(x=>say(x.message));else if(t.dataset.rfoto!==undefined)subir(fl,+t.dataset.rfoto,true).catch(x=>say(x.message));else if(t.dataset.add!==undefined)subir(fl,+t.dataset.add).catch(x=>say(x.message))};
$("#load").onclick=async()=>{
 try{say("Cargando…");
  const r=await fetch(url(),{headers:hd(),cache:"no-store"});
  if(!r.ok)throw new Error(r.status===404?"No encuentro data.json en ese repositorio.":"No pude conectar: revisá usuario, repositorio y token.");
  const j=await r.json();sha=j.sha;
  D=JSON.parse(decodeURIComponent(escape(atob(j.content.replace(/\n/g,"")))));D.trabajos=(D.trabajos||[]).map(x=>({l:"",t:"",...x,imgs:x.imgs||[x.img]}));D.resenas=(D.resenas||[]).map(x=>({foto:"",e:5,ig:"",...x}));D.textos={...DEF,...(D.textos||{})};
  localStorage.setItem("cfg",JSON.stringify({u:$("#u").value,r:$("#r").value,t:$("#t").value}));
  render();$("#sv").hidden=false;say("Listo, ya podés editar.");
 }catch(e){say(e.message)}
};
$("#save").onclick=async()=>{
 try{say("Guardando…");
  collect();D.trabajos.forEach(x=>{x.img=x.imgs[0]});
  const body={message:"Actualización desde el panel",sha,content:btoa(unescape(encodeURIComponent(JSON.stringify(D,null,1))))};
  const r=await fetch(url(),{method:"PUT",headers:hd(),body:JSON.stringify(body)});
  if(!r.ok)throw new Error("No se pudo guardar. Revisá que el token tenga permiso de escritura en Contents.");
  sha=(await r.json()).content.sha;say("Guardado. En 1 o 2 minutos se ve en la web.");
 }catch(e){say(e.message)}
};
</script>
</body></html>
